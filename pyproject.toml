[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-cli"
version = "0.2.0"
description = "Colour-coded terminal weather for macOS, Linux and Windows. No API key needed."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
weather = "weather_cli.colours:main"

[tool.setuptools.packages.find]
where = ["src"]